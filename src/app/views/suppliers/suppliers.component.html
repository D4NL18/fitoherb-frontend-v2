<section class="title-section" appTitleSectionReveal>
  <span>Nossos Parceiros</span>
  <h1>Fornecedores</h1>
  <p>Trabalhamos com as melhores indústrias para garantir a pureza e a eficácia de cada produto distribuído pela Fitoherb.</p>
</section>

<section class="suppliers-container" #suppliersGrid>
  <div class="grid suppliers-grid" appFlyIn3dGrid flyCardSelector=".supplier-card">
    @for (item of sortedSuppliers(); track item.slug) {
      <button
        class="supplier-card"
        [class.highlighted]="item.isHighlighted"
        (click)="goToGallery(item.slug)"
      >
        @if (item.isHighlighted) {
          <div class="premium-badge">
            <i class="fas fa-star"></i> Parceiro Premium
          </div>
        }

        <div class="image-box">
          @if (item.imageUrl) {
            <img [src]="item.imageUrl" [alt]="item.name" draggable="false" (error)="onSupplierImageError($event)">
          }
        </div>

        <div class="info">
          <h3>{{ item.name }}</h3>
          <span class="view-products-btn">
            Ver Produtos
            <i class="fas fa-arrow-right"></i>
          </span>
        </div>
      </button>
    }
  </div>
</section>
