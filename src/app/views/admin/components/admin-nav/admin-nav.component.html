<div class="mobile-header">
  <button class="logo-button" (click)="router.navigate(['/'])"><img src="assets/images/fitoherb-logo-white.png"
      alt="Fitoherb Logo" class="mobile-logo"></button>
  <button class="hamburger-btn" (click)="toggleMenu()">
    <i class="fa-solid" [class.fa-bars]="!isMenuOpen()" [class.fa-xmark]="isMenuOpen()"></i>
  </button>
</div>

<div class="nav-content" [class.open]="isMenuOpen()">
  <div class="nav-container">
    <button (click)="router.navigate(['/'])" class="logo-button"><img src="assets/images/fitoherb-logo-white.png"
        alt="Fitoherb Logo" class="logo desktop-only"></button>

    <ul class="list-container">
      @for (tab of tabs; track tab.label) {
      <li>
        <a href="javascript:void(0)" (click)="selectTab(tab.label)" [class.active]="activeTab() === tab.label">
          <i [class]="tab.icon"></i>
          {{ tab.label }}
        </a>
      </li>
      }
    </ul>
  </div>

  <div class="logout-box">
    <button (click)="logout()">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      Sair
    </button>
  </div>
</div>
