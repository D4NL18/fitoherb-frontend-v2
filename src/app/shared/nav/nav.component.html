<nav>
  <button class="hamburger" (click)="toggleMenu()" aria-label="Abrir menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <img
    src="/assets/images/fitoherb-logo.png"
    alt="Logo da Fitoherb"
    class="logo top-logo"
    aria-label="Logo da Fitoherb"
    draggable="false"
    routerLink="/"
  />

  @if (isMenuOpen) {
    <div class="backdrop" (click)="closeMenu()"></div>
  }

  <div class="menu-container" [class.open]="isMenuOpen">

    <div class="sidebar-header">
      <img
        src="/assets/images/fitoherb-logo.png"
        alt="Logo da Fitoherb"
        class="logo"
        draggable="false"
        routerLink="/"
        (click)="closeMenu()"
      />
      <button class="close-btn" (click)="closeMenu()" aria-label="Fechar menu">
        <i class="fa-solid fa-times"></i>
      </button>
    </div>

    <ul>
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" draggable="false" (click)="closeMenu()">Home</a></li>
      <li><a routerLink="/quem-somos" routerLinkActive="active" draggable="false" (click)="closeMenu()">Quem Somos</a></li>
      <li class="dropdown" (mouseenter)="isProductsDropdownOpen = true" (mouseleave)="isProductsDropdownOpen = false">
        <a routerLink="/produtos" routerLinkActive="active" draggable="false" (click)="closeMenu()">
          Produtos <i class="fa-solid fa-chevron-down"></i>
        </a>
        @if (isProductsDropdownOpen) {
          <ul class="dropdown-menu">
            @for (cat of categories(); track cat.slug) {
              <li><a [routerLink]="['/produtos']" [queryParams]="{category: cat.slug}" (click)="closeMenu()">{{ cat.name }}</a></li>
            }
            <li class="divider"></li>
            <li><a routerLink="/produtos" (click)="closeMenu()"><strong>Ver todos os produtos</strong></a></li>
          </ul>
        }
      </li>
      <li><a routerLink="/fornecedores" routerLinkActive="active" draggable="false" (click)="closeMenu()">Fornecedores</a></li>
      <li><a routerLink="/contato" routerLinkActive="active" draggable="false" (click)="closeMenu()">Fale Conosco</a></li>
    </ul>

    <button class="admin-btn" routerLink="/login" (click)="closeMenu()">
      <i class="fa-solid fa-user-lock"></i>
      <p>Admin</p>
    </button>
  </div>
</nav>
