<div class="modal-overlay" (click)="onClose()">
  <div class="modal-card" [class.error]="!isSuccess()" (click)="$event.stopPropagation()">
    <div class="icon-box">
      @if (isSuccess()) {
        <i class="fas fa-check-circle"></i>
      } @else {
        <i class="fas fa-exclamation-triangle"></i>
      }
    </div>

    <div class="content">
      <h3>{{ isSuccess() ? 'Sucesso!' : 'Ops, algo deu errado' }}</h3>
      <p>{{ message() }}</p>
      <span class="status-code">Status: {{ status() }}</span>
    </div>

    <button class="btn-confirm" (click)="onClose()">
      Entendido
    </button>
  </div>
</div>
