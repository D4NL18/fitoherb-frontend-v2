@if (showLayout()) {
  <header><app-nav></app-nav></header>
}

<main [class.main-content]="showLayout()">
  <router-outlet></router-outlet>
</main>

@if (showLayout()) {
  <app-footer></app-footer>
}

  <button class="scroll-to-top-btn" (click)="scrollToTop()" aria-label="Voltar ao topo">
    <i class="fas fa-chevron-up"></i>
  </button>
}
